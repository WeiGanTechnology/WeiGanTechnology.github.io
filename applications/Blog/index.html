<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我博客 法律文件</title>
  <style>
    :root {
      --primary-color: #0a59f7;
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }

    .policy-container {
      background: #ffffff;
      max-width: 860px;
      width: 100%;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    .meta {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--primary-color);
      margin: 2rem 0 0.75rem;
    }

    p {
      margin-bottom: 1rem;
      color: #334155;
      word-break: break-word;
    }

    ul {
      margin: 0 0 1rem 1.25rem;
      padding: 0;
    }

    li {
      margin-bottom: 0.75rem;
      color: #334155;
    }

    a {
      color: var(--primary-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    strong {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <div class="policy-container">
      <h1>我博客 法律文件</h1>
      <p class="meta">更新日期：2026.9.4 · 适用于 iOS、iPadOS、macOS 与 visionOS</p>

      <p>

      </p>

      <h2>用户协议</h2>
      <ul>
        <li><a href="UserAgreement.html">用户协议（简体中文）</a></li>
        <li><a href="UserAgreement_EN.html">User Agreement (English)</a></li>
      </ul>

      <h2>隐私政策</h2>
      <ul>
        <li><a href="PrivacyPolicy.html">隐私政策（简体中文）</a></li>
        <li><a href="PrivacyPolicy_EN.html">Privacy Policy (English)</a></li>
      </ul>

      <h2>联系我们</h2>
      <p>邮箱：<a href="mailto:weigantechnology@outlook.com">weigantechnology@outlook.com</a></p>
    </div>
  </main>
</body>
</html>
